services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - reco_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8081:8081"
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend


  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"

  reco-job:
    build:
      context: ./reco-ml
    volumes:
      - ./reco-ml:/jobs
      - ./datasets:/datasets
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_ENRICH_LIMIT: ${TMDB_ENRICH_LIMIT:-100}
      TMDB_ENRICH_BATCH_SIZE: ${TMDB_ENRICH_BATCH_SIZE:-25}
      TMDB_REQUEST_DELAY_SECONDS: ${TMDB_REQUEST_DELAY_SECONDS:-0.25}

  reco-tests:
    build:
      context: ./reco-ml
    volumes:
      - ./reco-ml:/jobs
    working_dir: /jobs
    depends_on:
      - db
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-reco_db}
      DB_USER: ${POSTGRES_USER:-reco_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-reco_pass}
      PYTHONPATH: /jobs
    command: [ "pytest", "-q" ]

volumes:
  reco_data:
