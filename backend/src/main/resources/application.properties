# Application
spring.application.name=reco
server.port=8081
# Datasource (PostgreSQL via Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reco_db}
spring.datasource.username=${DB_USER:reco_user}
spring.datasource.password=${DB_PASSWORD:reco_pass}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway
spring.flyway.enabled=true
# Tests
app.smoke-test.enabled=false
# HTTP responses
server.error.include-message=always
