name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch: # Manually trigger a workflow in Github Actions

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build application frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test application backend
        run: ./mvnw --batch-mode --no-transfer-progress verify


  python:
    name: Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reco-ml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: reco-ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest


  container-images:
    name: Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - frontend
      - backend
      - python

    strategy:
      fail-fast: false # allow all jobs to complete even if one fails
      matrix:
        include:
          - image: frontend
            context: ./frontend
          - image: backend
            context: ./backend
          - image: reco-ml
            context: ./reco-ml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false # only build the image
          tags: content-recommendation-platform-${{ matrix.image }}:ci
          cache-from: type=gha, scope={ matrix.image }} # fill cache from previous runs of this workflow
          cache-to: type=gha, mode=max, scope=${{ matrix.image }} # store cache for future runs of this workflow
