name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch: # Manually trigger a workflow in Github Actions

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build application frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build application backend
        run: mvn clean install -DskipTests

      - name: Run tests
        run: mvn test

  python:
    name: Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reco-ml

  container-images:
    needs:
      - frontend
      - backend
      - python
